# Default values
highlight_color = "#efbf71"      # --dt-yellow
cursor = "█"
terminal_launcher = "kitty -e"
hard_stop = false

# UI Customization
rounded_borders = false

# Border Colors (individual colors for each panel)
main_border_color = "#3b403c"      # --dt-gray-3, border color for the main info panel (top)
apps_border_color = "#3b403c"      # --dt-gray-3, border color for the apps list panel (middle)
input_border_color = "#3b403c"     # --dt-gray-3, border color for the input panel (bottom)

# Text Colors (non-highlighted text in each panel)
main_text_color = "#f4decd"        # --dt-white, text color for the main info panel
apps_text_color = "#f4decd"        # --dt-white, text color for the apps list
input_text_color = "#f4decd"       # --dt-white, text color for the input field

# Fancy Mode - Show selected app info in panel titles
fancy_mode = true               # When true: "Apps" becomes selected app name, "Gyr" becomes app description

# Header title color (for panel border titles)
header_title_color = "#abd4bf" # --dt-cyan-7, color for all panel header titles

# Layout Configuration (percentages and sizes)
title_panel_height_percent = 30  # Height of top panel as percentage (10-70%)
input_panel_height = 3           # Height of input panel in lines (1-10)
# Note: Apps panel gets the remaining space automatically
